########################################################
### Destroy AWS CDK with the Python SDK
########################################################

name : Destroy AWS infrastructure using AWS CDK with the Python SDK
on:
  push:
    branches:
      - develop-cicd

jobs:

  destroy-serverless:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backendservice
    env:
      ENVIRONMENT: dev
      API_ROOT_PATH: api/v1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install ALL dependencies including devDependencies
      - name: Install dependencies
        run: npm install

      - name: Install Serverless Framework
        run: npm install -g serverless@4.0.0
      - name: Retrieve Secrets from AWS Secrets Manager
        id: get-secrets
        run: |
          SECRET_NAME="testpy-dev-db-credentials"
          SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id $SECRET_NAME --query SecretString --output text)
          echo "$SECRET_VALUE" > secret.json
          DB_NAME=$(jq -r '.db_name' secret.json)
          DB_USER=$(jq -r '.db_user' secret.json)
          DB_PASSWORD=$(jq -r '.db_password' secret.json)
          DB_HOST=$(jq -r '.host' secret.json)

          echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV
          echo "DB_USER=$DB_USER" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV

      # Create minimal env.yml needed for destruction
      - name: Create destruction env.yml
        run: |
          cat <<EOF > env.yml
          $ENVIRONMENT:
            DB_HOST: ${{ env.DB_HOST }}
            DB_NAME: ${{ env.DB_NAME }}
            DB_USER: ${{ env.DB_USER }}
            DB_PASSWORD: ${{ env.DB_PASSWORD }}
            DB_PORT: 5432
            
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            PG_ENCRYPT_SECRET: ${{ secrets.PG_ENCRYPT_SECRET }}
            AWS_SES_SENDER_EMAIL: ${{ secrets.AWS_SES_SENDER_EMAIL }}
            FE_APP_URL: ${{ secrets.FE_APP_URL }}
            API_ROOT_PATH: ${API_ROOT_PATH}
          EOF

      - name: Destroy Serverless App
        run: |
          export SERVERLESS_LICENSE_KEY=${{ secrets.SERVERLESS_LICENSE_KEY }}
          sls remove --stage $ENVIRONMENT

  aws-infra-destroy:
    needs: destroy-serverless
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    env:
      ENVIRONMENT: dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Instal AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CDK Destroy Infrastructure
        run: |
          cdk destroy --all --force --context env=${{ env.ENVIRONMENT }}
          echo "Infrastructure destroyed successfully"

      - name: Destroy CDK Bootstrap Stack
        run: |
          # Check if stack exists
          if aws cloudformation describe-stacks --stack-name CDKToolkit &>/dev/null; then
            echo "Destroying CDK bootstrap stack"
            aws cloudformation delete-stack --stack-name CDKToolkit
            aws cloudformation wait stack-delete-complete --stack-name CDKToolkit
          else
            echo "CDK bootstrap stack not found"
          fi

      - name: Remove S3 bucket
        run: |
          cd ..
          ls -al
          bash ./z-del-s3.sh
